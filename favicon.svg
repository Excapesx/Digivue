<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#18191b"/>
  <!-- 菱形 = digivue 的 ◆ 标记，也是价格刻度的外框 -->
  <path d="M32 12 L52 32 L32 52 L12 32 Z" fill="none" stroke="#ff4a1f" stroke-width="6"
        stroke-linejoin="round"/>
  <!-- 中心竖线：一根刻度，呼应「按预算挑」 -->
  <path d="M32 23 L32 41" stroke="#eff0f1" stroke-width="5" stroke-linecap="round"/>
</svg>
